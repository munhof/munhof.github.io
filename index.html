<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#101311">
  <meta name="description" content="Portafolio de Facundo Munhó">
  <title>Facundo Munhó · Portfolio</title>
  <link rel="canonical" href="https://munhof.com.ar/">
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="portfolio">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="noise" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="#top" aria-label="Facundo Munhó">
      <span class="brand-mark">FM</span>
      <span class="brand-name">Facundo Munhó</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">Menu</button>
    <nav id="main-nav" class="main-nav" aria-label="Principal">
      <a href="#profile" data-copy="ui.navAbout">Perfil</a>
      <a href="#projects" data-copy="ui.navProjects">Proyectos</a>
      <a href="#experience" data-copy="ui.navExperience">Experiencia</a>
      <a href="#education" data-copy="ui.navEducation">Formación</a>
      <a href="#contact" data-copy="ui.navContact">Contacto</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema">
        <span aria-hidden="true">◐</span>
      </button>
      <div class="lang-switch" aria-label="Idioma">
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="top" class="hero section-shell">
      <div class="hero-copy reveal">
        <p class="eyebrow" data-copy="hero.eyebrow"></p>
        <h1 data-copy="hero.title"></h1>
        <p class="hero-summary" data-copy="hero.summary"></p>
        <div class="hero-actions">
          <a class="button button-primary" href="#projects" data-copy="ui.navProjects">Proyectos</a>
          <a class="button button-secondary" href="cv.html?lang=es" data-cv-link data-copy="ui.openCv">Ver CV</a>
        </div>
        <div class="availability">
          <span class="status-dot" aria-hidden="true"></span>
          <span data-copy="hero.availability"></span>
        </div>
      </div>
      <aside class="hero-card reveal" aria-label="Professional snapshot">
        <div class="hero-card-top">
          <span class="mono">PROFILE / 2026</span>
          <span class="signal" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div class="monogram" aria-hidden="true">FM</div>
        <p data-copy="hero.status"></p>
        <div class="coordinate mono">BUENOS AIRES · ARGENTINA</div>
      </aside>
    </section>

    <section class="stats-band" aria-label="Highlights">
      <div id="stats" class="stats section-shell"></div>
    </section>

    <section id="profile" class="profile section-shell section-space">
      <div class="section-heading reveal">
        <p class="eyebrow">PROFILE / 01</p>
        <h2 data-copy="about.title"></h2>
      </div>
      <div class="profile-content reveal">
        <p class="lead" data-copy="about.lead"></p>
        <p data-copy="about.body"></p>
        <div id="principles" class="principles"></div>
      </div>
    </section>

    <section id="projects" class="section-shell section-space">
      <div class="section-heading wide reveal">
        <p class="eyebrow" data-copy="sections.projectsEyebrow"></p>
        <h2 data-copy="sections.projectsTitle"></h2>
      </div>
      <div id="projects-grid" class="projects-grid"></div>
    </section>

    <section id="experience" class="section-shell section-space">
      <div class="section-heading reveal">
        <p class="eyebrow" data-copy="sections.experienceEyebrow"></p>
        <h2 data-copy="sections.experienceTitle"></h2>
      </div>
      <div id="experience-list" class="timeline"></div>
    </section>

    <section id="education" class="section-shell section-space">
      <div class="section-heading reveal">
        <p class="eyebrow" data-copy="sections.educationEyebrow"></p>
        <h2 data-copy="sections.educationTitle"></h2>
      </div>
      <div id="education-list" class="education-grid"></div>
    </section>

    <section id="skills" class="section-shell section-space">
      <div class="section-heading reveal">
        <p class="eyebrow" data-copy="sections.skillsEyebrow"></p>
        <h2 data-copy="sections.skillsTitle"></h2>
      </div>
      <div id="skills-grid" class="skills-grid"></div>
    </section>

    <section id="contact" class="contact section-shell section-space reveal">
      <div>
        <p class="eyebrow">CONTACT / 05</p>
        <h2 data-copy="ui.contactCta"></h2>
        <p class="lead" data-copy="ui.contactText"></p>
      </div>
      <div class="contact-actions">
        <a class="button button-primary" href="mailto:facundomunho@gmail.com">facundomunho@gmail.com</a>
        <a class="text-link" href="https://www.linkedin.com/in/facundomunho/" target="_blank" rel="noreferrer" data-copy="ui.viewLinkedin">LinkedIn</a>
        <a class="text-link" href="https://github.com/munhof" target="_blank" rel="noreferrer" data-copy="ui.viewGithub">GitHub</a>
      </div>
    </section>
  </main>

  <footer class="site-footer section-shell">
    <p>© <span id="year"></span> Facundo Nicolás Munhó Vital. <span data-copy="ui.rights"></span></p>
    <p class="mono"><span data-copy="ui.sourceNote"></span> · <span data-copy="ui.updated"></span>: <time id="updated"></time></p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
