<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="index,follow">
  <title>CV · Facundo Munhó</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="cv" class="cv-page">
  <div class="cv-toolbar no-print">
    <a class="text-link" href="index.html" data-copy="ui.backPortfolio">Volver al portafolio</a>
    <div class="lang-switch" aria-label="Idioma">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button class="button button-primary" type="button" data-print data-copy="ui.printCv">Guardar como PDF</button>
  </div>

  <main id="cv-document" class="cv-document">
    <header class="cv-header">
      <div>
        <p class="eyebrow" data-copy="ui.cvTitle"></p>
        <h1 id="cv-name"></h1>
        <p id="cv-headline" class="cv-headline"></p>
      </div>
      <div id="cv-contact" class="cv-contact"></div>
    </header>

    <section class="cv-section">
      <h2 data-copy="ui.professionalSummary"></h2>
      <p data-copy="cv.summary"></p>
    </section>

    <section class="cv-section">
      <h2 data-copy="ui.technicalSkills"></h2>
      <div id="cv-skills" class="cv-skills"></div>
    </section>

    <section class="cv-section">
      <h2 data-copy="ui.workExperience"></h2>
      <div id="cv-experience"></div>
    </section>

    <section class="cv-section">
      <h2 data-copy="ui.education"></h2>
      <div id="cv-education"></div>
    </section>

    <section class="cv-section">
      <h2 data-copy="ui.projectsTeaching"></h2>
      <ul id="cv-projects"></ul>
    </section>

    <section class="cv-section compact">
      <h2 data-copy="ui.languages"></h2>
      <p id="cv-languages"></p>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
